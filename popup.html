<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amtel Activator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Minimal Red Header -->
    <header class="app-header">
      <div class="brand">
        <h1 style="font-weight:300;">✅ Batch Activator</h1>
      </div>
      <div class="header-actions">
        <span id="connectionBadge" class="badge checking">Connecting…</span>
        <button id="resetHeaderBtn" class="btn-icon-head" title="Reset">🔄</button>
      </div>
    </header>

    <main class="app-main">
      <div class="card">
        <!-- 4 Clean Type Buttons -->
        <div class="segmented-control" role="tablist">
          <button type="button" class="mode-pill active" data-value="auto">Auto</button>
          <button type="button" class="mode-pill" data-value="MSISDN">MSISDN</button>
          <button type="button" class="mode-pill" data-value="IMSI">IMSI</button>
          <button type="button" class="mode-pill" data-value="ICCID">ICCID</button>
        </div>
        <select id="searchTypeSelect" class="hidden-accessible">
          <option value="auto">Auto</option>
          <option value="MSISDN">MSISDN</option>
          <option value="IMSI">IMSI</option>
          <option value="ICCID">ICCID</option>
        </select>

        <!-- Clean Input Box with Upload -->
        <div class="editor-container" id="editorContainer">
          <textarea
            id="batchInput"
            class="editor-textarea"
            rows="6"
            spellcheck="false"
            placeholder="Paste numbers, or drop an .xlsx / .csv file (IMSI, MSISDN or ICCID column)..."
          ></textarea>
          <div class="editor-footer">
            <span id="lineCountBadge" class="count-badge">0 items</span>
            <div class="footer-actions">
              <input type="file" id="fileInput" accept=".csv,.tsv,.txt,.xlsx,.xlsm" style="display:none;" />
              <button type="button" id="uploadFileBtn" class="link-btn">📁 Upload File</button>
              <button type="button" id="sampleBtn" class="link-btn">Sample</button>
            </div>
          </div>
        </div>
        <div id="sourceStatus" class="source-status hidden" role="status" aria-live="polite"></div>

        <!-- Compact Options -->
        <div class="options-row">
          <select id="speedSelect" class="form-select-sm">
            <option value="300">Fast (300ms)</option>
            <option value="800" selected>Normal (800ms)</option>
            <option value="1500">Safe (1500ms)</option>
          </select>
          <label class="compact-check"><input type="checkbox" id="dedupeCheck" checked /> Dedupe</label>
          <label class="compact-check"><input type="checkbox" id="soundCheck" checked /> Sound</label>
        </div>

        <!-- Main Action Buttons -->
        <div class="action-bar">
          <button id="startBatchBtn" class="btn btn-primary btn-glow">Start</button>
          <button id="pauseBatchBtn" class="btn btn-warning hidden">Pause</button>
          <button id="resumeBatchBtn" class="btn btn-success hidden">Resume</button>
          <button id="stopBatchBtn" class="btn btn-danger hidden">Stop</button>
          <button id="clearBtn" class="btn btn-secondary">Clear</button>

        </div>

        <!-- Progress (Only visible during batch) -->
        <div id="progressSection" class="progress-wrap hidden">
          <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill" style="width: 0%"></div>
          </div>
          <div class="progress-info">
            <span id="progressCounter">0 / 0</span>
            <span id="currentStatusText" class="status-text">Ready</span>
            <span id="progressPercent" class="percent-text">0%</span>
          </div>
        </div>

        <!-- Results Summary (Clean, Compact) -->
        <div id="reportSection" class="results-wrap hidden">
          <div class="stats-row">
            <span class="stat-pill success">Activated: <strong id="metricActivated">0</strong></span>
            <span class="stat-pill info">Active: <strong id="metricAlreadyActive">0</strong></span>
            <span class="stat-pill danger">Failed: <strong id="metricSkipped">0</strong></span>
          </div>
          <div class="export-row">
            <button id="retryFailedBtn" class="btn btn-xs btn-outline-warning hidden">Retry Failed</button>
            <button id="downloadCsvBtn" class="btn btn-xs btn-secondary">Export CSV</button>
            <button id="copyReportBtn" class="btn btn-xs btn-secondary">Copy</button>
          </div>
          <div id="reportList" class="report-list"></div>
        </div>
      </div>
        </main>
    <footer class="app-footer">
        <span class="contact-info">📞 For support call Amtel Qardho | 0717102026 , 0716408296</span>
    </footer>


    <script src="parser.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
